    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="style.css">
        <title>Document</title>
    </head>
    <body>
        <div id ='hud'>
            <div class="health-bar-bg" id="playerHealthFill">
                <div class="health-fill" ></div>
            </div>
            <span class="fighter-name">P1</span>
            <span id="timer">60</span>
            <span class="fighter-name">P2</span>
            <div class="health-bar-bg" id="enemyHealthFill">
                <div class="health-fill" ></div>
            </div>
        </div>
        <div id="fpsCounter" style="position:fixed;top:4px;right:10px;color:#0f0;font:12px monospace;z-index:1000;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:3px;">FPS: --</div>
        <div id="gameWrapper">
            <canvas id="gameCanvas"></canvas>

            <!-- 联机连接状态 -->
            <div id="connectionStatus">正在连接服务器...</div>

            <!-- 全屏按钮 -->
            <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ 全屏</button>

            <!-- 联机模式: 单人操控 (移动在左/攻击在右) -->
            <div id="mobileControlsOnline" class="mobile-controls">
                <div class="controls-side controls-left">
                    <div class="ctrl-row">
                        <button class="ctrl-btn" id="ctrl-left">◀</button>
                        <button class="ctrl-btn" id="ctrl-right">▶</button>
                    </div>
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-jump" id="ctrl-jump">▲</button>
                    </div>
                </div>
                <div class="controls-side controls-right">
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-attack" id="ctrl-attack">攻击</button>
                    </div>
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-special" id="ctrl-special">必杀</button>
                    </div>
                </div>
            </div>

            <!-- 本地模式: 双人操控 -->
            <div id="mobileControlsLocal" class="mobile-controls">
                <div class="controls-side controls-left">
                    <div class="ctrl-row">
                        <button class="ctrl-btn" id="p1-left">◀</button>
                        <button class="ctrl-btn" id="p1-right">▶</button>
                    </div>
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-jump" id="p1-jump">▲</button>
                    </div>
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-attack" id="p1-attack">攻击</button>
                        <button class="ctrl-btn ctrl-special" id="p1-special">必杀</button>
                    </div>
                </div>
                <div class="controls-side controls-right">
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-attack" id="p2-attack">攻击</button>
                        <button class="ctrl-btn ctrl-special" id="p2-special">必杀</button>
                    </div>
                    <div class="ctrl-row">
                        <button class="ctrl-btn ctrl-jump" id="p2-jump">▲</button>
                    </div>
                    <div class="ctrl-row">
                        <button class="ctrl-btn" id="p2-left">◀</button>
                        <button class="ctrl-btn" id="p2-right">▶</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 角色选择界面 -->
        <div id="selectScreen">
            <div class="select-title">选择角色</div>
            <div class="select-container">
                <div class="select-player" id="p1Select">
                    <div class="select-player-label">P1</div>
                    <div class="char-options">
                        <div class="char-card selected" data-player="1" data-char="king blue">
                            <img src="img/king blue/Idle.png" class="char-preview">
                            <div class="char-name">蓝骑士</div>
                        </div>
                    </div>
                </div>
                <div class="select-vs">VS</div>
                <div class="select-player" id="p2Select">
                    <div class="select-player-label">P2</div>
                    <div class="char-options">
                        <div class="char-card selected" data-player="2" data-char="king blue">
                            <img src="img/king blue/Idle.png" class="char-preview">
                            <div class="char-name">蓝骑士</div>
                        </div>
                    </div>
                </div>
            </div>
            <button id="confirmSelectBtn">确认选择</button>
        </div>

        <!-- 准备界面 -->
        <div id="startScreen">
            <div class="start-title">双人格斗</div>
            <div class="ready-container">
                <div class="ready-slot" id="p1Ready">
                    <div class="ready-label">P1</div>
                    <div class="ready-key" id="p1ReadyKey">按 J 准备</div>
                    <div class="ready-status" id="p1Status">未准备</div>
                </div>
                <div class="vs-text">VS</div>
                <div class="ready-slot" id="p2Ready">
                    <div class="ready-label">P2</div>
                    <div class="ready-key" id="p2ReadyKey">按 1 准备</div>
                    <div class="ready-status" id="p2Status">未准备</div>
                </div>
            </div>
            <div class="mobile-ready-hint">点击"准备"按钮开始</div>
        </div>

        <div id="vsScreen">P1 VS P2</div>
        <div id="gameOver">
            <div id="winnerText">P1 获胜！</div>
            <button id="restartBtn" onclick="restartGame()">重新开始</button>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
        <script src="util.js"></script>
        <script src="sptite.js"></script>

        <script src="main.js"></script>
    </body>
    </html>
